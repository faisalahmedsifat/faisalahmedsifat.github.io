<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faisal Ahmed Sifat — Distributed Systems · ML Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ─── TOKENS ───────────────────────────────────────────────── */
    :root {
      --bg:        #050608;
      --bg-2:      #0a0c10;
      --bg-panel:  rgba(12, 15, 22, 0.75);
      --cyan:      #00f0ff;
      --cyan-dim:  rgba(0, 240, 255, 0.12);
      --cyan-mid:  rgba(0, 240, 255, 0.35);
      --amber:     #f5c842;
      --amber-dim: rgba(245, 200, 66, 0.15);
      --white:     #ffffff;
      --gray-1:    #e2e8f0;
      --gray-2:    #94a3b8;
      --gray-3:    #475569;
      --border:    rgba(0, 240, 255, 0.10);
      --border-hi: rgba(0, 240, 255, 0.30);
      --font-mono: 'Space Mono', monospace;
      --font-serif:'Cormorant Garamond', serif;
      --font-body: 'DM Sans', sans-serif;
    }

    /* ─── RESET ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--gray-1);
      font-family: var(--font-body);
      font-weight: 300;
      overflow-x: hidden;
      cursor: none;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--cyan); color: var(--bg); }

    /* ─── SCROLLBAR ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gray-3); border-left: 1px solid var(--cyan); }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

    /* ─── GRID BACKGROUND ───────────────────────────────────────── */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -20;
      pointer-events: none;
    }

    /* ─── RADIAL VIGNETTE ───────────────────────────────────────── */
    body::after {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(5,6,8,0.85) 100%);
      z-index: -19;
      pointer-events: none;
    }

    /* ─── CUSTOM CURSOR ─────────────────────────────────────────── */
    #cursor {
      position: fixed;
      width: 20px; height: 20px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
    #cursor::before, #cursor::after {
      content: ""; position: absolute; background: var(--cyan);
    }
    #cursor::before { top: 9px; left: 0; width: 20px; height: 2px; }
    #cursor::after  { top: 0; left: 9px; width: 2px; height: 20px; }
    #cursor.hovered { transform: translate(-50%,-50%) scale(1.6) rotate(45deg); }
    #cursor.hovered::before, #cursor.hovered::after { background: #fff; box-shadow: 0 0 8px #fff; }
    @media (hover: none) { #cursor { display: none; } body { cursor: auto; } }

    /* ─── PROGRESS BAR ──────────────────────────────────────────── */
    #progress {
      position: fixed; top: 0; left: 0; height: 2px;
      background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
      z-index: 200; transform-origin: left; transform: scaleX(0);
      transition: transform 0.1s linear;
    }

    /* ─── GLASS PANEL ───────────────────────────────────────────── */
    .glass {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      position: relative;
    }
    .glass::before {
      content: ""; position: absolute;
      top: 0; left: 0; width: 14px; height: 14px;
      border-top: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan);
      opacity: 0.4; transition: opacity 0.3s;
    }
    .glass::after {
      content: ""; position: absolute;
      bottom: 0; right: 0; width: 14px; height: 14px;
      border-bottom: 1.5px solid var(--cyan); border-right: 1.5px solid var(--cyan);
      opacity: 0.4; transition: opacity 0.3s;
    }
    .glass:hover::before, .glass:hover::after { opacity: 1; }

    /* ─── UTILITY ───────────────────────────────────────────────── */
    .mono    { font-family: var(--font-mono); }
    .serif   { font-family: var(--font-serif); }
    .label   { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.12em; color: var(--cyan); text-transform: uppercase; }
    .muted   { color: var(--gray-2); }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
    .section { padding: 8rem 0; }

    /* section heading */
    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 300;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--white);
    }
    .section-title span { color: var(--gray-3); }

    /* horizontal rule accent */
    .rule { width: 3rem; height: 1px; background: var(--cyan); opacity: 0.5; margin: 1.5rem 0; }

    /* cyan underline */
    .u-cyan { border-bottom: 1.5px solid var(--cyan); padding-bottom: 2px; }

    /* fade-in animation */
    .fade-up {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    /* ─── NAV ───────────────────────────────────────────────────── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      transition: background 0.3s;
    }
    #nav.scrolled { background: rgba(5,6,8,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.5rem; font-weight: 600;
      letter-spacing: -0.03em; color: var(--white);
    }
    .nav-links {
      display: flex; align-items: center; gap: 0;
    }
    .nav-links .glass {
      display: flex; align-items: center;
      padding: 0.4rem 0.5rem;
    }
    .nav-links a {
      font-family: var(--font-mono);
      font-size: 0.7rem; letter-spacing: 0.08em;
      padding: 0.4rem 1rem;
      color: var(--gray-2);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-cv {
      font-family: var(--font-mono);
      font-size: 0.7rem; letter-spacing: 0.08em;
      padding: 0.5rem 1.25rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
      color: var(--gray-1);
      transition: background 0.2s, color 0.2s;
      margin-left: 1rem;
    }
    .nav-cv:hover { background: var(--white); color: var(--bg); }

    /* mobile burger */
    #burger {
      display: none; flex-direction: column;
      gap: 5px; cursor: pointer; background: none; border: none; padding: 4px;
    }
    #burger span { width: 22px; height: 1.5px; background: var(--white); display: block; transition: all 0.3s; }
    #mobile-menu {
      display: none; position: fixed; inset: 0;
      background: var(--bg); z-index: 99;
      flex-direction: column; justify-content: center; align-items: center;
      gap: 2.5rem;
    }
    #mobile-menu.open { display: flex; }
    #mobile-menu a {
      font-family: var(--font-serif); font-size: 2.5rem;
      color: var(--gray-1); transition: color 0.2s;
    }
    #mobile-menu a:hover { color: var(--cyan); }

    @media (max-width: 768px) {
      .nav-links, .nav-cv { display: none; }
      #burger { display: flex; }
    }

    /* ─── HERO ──────────────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex; align-items: center;
      padding: 8rem 0 4rem;
      position: relative; overflow: hidden;
    }
    .hero-bg-blobs {
      position: absolute; inset: 0; pointer-events: none; z-index: -1;
    }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(80px); mix-blend-mode: screen;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 { width: 500px; height: 500px; top: 10%; left: 5%;  background: rgba(0,240,255,0.04); animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; top: 30%; right: 10%; background: rgba(0,80,200,0.05); animation-delay: -4s; }
    .blob-3 { width: 350px; height: 350px; bottom: 10%; left: 30%; background: rgba(30,30,60,0.08); animation-delay: -8s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.05); } }

    .hero-content { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem; letter-spacing: 0.15em;
      color: var(--cyan); margin-bottom: 2rem;
      opacity: 0; animation: fadeUp 0.6s 0.1s forwards;
    }
    .hero-eyebrow .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .hero-sub {
      font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.2em; color: var(--gray-3);
      text-transform: uppercase; margin-bottom: 1.5rem;
      opacity: 0; animation: fadeUp 0.6s 0.2s forwards;
    }

    .hero-name {
      font-family: var(--font-serif);
      font-size: clamp(4rem, 12vw, 9.5rem);
      font-weight: 300; line-height: 0.88;
      letter-spacing: -0.03em;
      margin-bottom: 3rem;
    }
    .hero-name .line-1 {
      display: block; color: var(--white);
      opacity: 0; animation: fadeUp 0.7s 0.3s forwards;
    }
    .hero-name .line-2 {
      display: block; color: var(--gray-3);
      opacity: 0; animation: fadeUp 0.7s 0.45s forwards;
    }

    .hero-rule {
      width: 4rem; height: 1px; background: rgba(0,240,255,0.4);
      margin-bottom: 2.5rem;
      opacity: 0; animation: fadeUp 0.6s 0.55s forwards;
    }

    .hero-card {
      display: inline-block;
      opacity: 0; animation: fadeUp 0.7s 0.65s forwards;
    }
    .hero-card .glass {
      padding: 1.25rem 1.75rem;
      border-left: 2px solid var(--cyan);
    }
    .hero-card-tag {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.12em; color: var(--gray-3);
      text-transform: uppercase; margin-bottom: 0.6rem;
    }
    .hero-card-text {
      font-family: var(--font-serif);
      font-size: clamp(1.1rem, 2.5vw, 1.55rem);
      font-weight: 300; line-height: 1.4; color: var(--white);
      max-width: 560px;
    }
    .hero-card-text .accent { color: var(--white); border-bottom: 1.5px solid var(--cyan); padding-bottom: 1px; }

    .hero-ctas {
      display: flex; gap: 1rem; margin-top: 2.5rem; flex-wrap: wrap;
      opacity: 0; animation: fadeUp 0.6s 0.8s forwards;
    }
    .cta-btn {
      font-family: var(--font-mono); font-size: 0.72rem;
      letter-spacing: 0.1em; padding: 0.75rem 1.75rem;
      border: 1px solid var(--border-hi); background: var(--cyan-dim);
      color: var(--cyan); transition: all 0.25s; display: inline-block;
    }
    .cta-btn:hover { background: var(--cyan); color: var(--bg); }
    .cta-btn.ghost { background: transparent; border-color: var(--gray-3); color: var(--gray-2); }
    .cta-btn.ghost:hover { border-color: var(--white); color: var(--white); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── ABOUT ─────────────────────────────────────────────────── */
    #about .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 5rem; align-items: start;
    }
    .about-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; margin-top: 2.5rem;
      border: 1px solid var(--border);
    }
    .stat-card {
      background: var(--bg-panel); padding: 1.25rem 1rem;
      text-align: center; border-right: 1px solid var(--border);
    }
    .stat-card:last-child { border-right: none; }
    .stat-num {
      font-family: var(--font-serif); font-size: 2.8rem;
      font-weight: 300; color: var(--cyan); line-height: 1;
      display: block; margin-bottom: 0.3rem;
    }
    .stat-label {
      font-family: var(--font-mono); font-size: 0.58rem;
      letter-spacing: 0.1em; color: var(--gray-3);
      text-transform: uppercase;
    }
    .about-text p { color: var(--gray-2); margin-bottom: 1.25rem; font-size: 0.95rem; line-height: 1.8; }
    .about-text p:first-child::first-letter {
      font-family: var(--font-serif); font-size: 3.5rem;
      font-weight: 300; float: left; line-height: 0.8;
      margin-right: 0.15em; color: var(--white);
    }

    @media (max-width: 768px) {
      #about .grid { grid-template-columns: 1fr; gap: 3rem; }
    }

    /* ─── EXPERIENCE ────────────────────────────────────────────── */
    #experience .timeline {
      max-width: 900px; margin: 4rem auto 0; position: relative;
    }
    #experience .timeline::before {
      content: ""; position: absolute;
      left: 50%; top: 0; bottom: 0; width: 1px;
      background: var(--border); transform: translateX(-50%);
    }
    .tl-item {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0; margin-bottom: 4rem; position: relative;
    }
    .tl-dot {
      position: absolute; left: 50%; top: 0.5rem;
      width: 10px; height: 10px;
      background: var(--bg); border: 1px solid var(--gray-3);
      transform: translateX(-50%);
      transition: border-color 0.3s, background 0.3s;
    }
    .tl-item:hover .tl-dot { border-color: var(--cyan); background: var(--cyan); }
    .tl-left { padding-right: 3rem; text-align: right; }
    .tl-right { padding-left: 3rem; }
    .tl-role {
      font-family: var(--font-serif); font-size: 1.5rem;
      font-weight: 400; color: var(--white); line-height: 1.2;
      margin-bottom: 0.3rem;
      transition: color 0.2s;
    }
    .tl-item:hover .tl-role { color: var(--cyan); }
    .tl-org { font-size: 0.85rem; color: var(--gray-2); margin-bottom: 0.3rem; }
    .tl-date {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.12em; color: var(--gray-3);
      text-transform: uppercase;
    }
    .tl-desc { font-size: 0.88rem; color: var(--gray-2); line-height: 1.7; }

    /* alternate sides */
    .tl-item:nth-child(even) .tl-left { order: 2; text-align: left; padding-left: 3rem; padding-right: 0; }
    .tl-item:nth-child(even) .tl-right { order: 1; padding-right: 3rem; padding-left: 0; text-align: right; }

    @media (max-width: 768px) {
      #experience .timeline::before { left: 1rem; }
      .tl-item { grid-template-columns: 1fr; }
      .tl-dot { left: 1rem; }
      .tl-left, .tl-right { padding-left: 2.5rem; padding-right: 0; text-align: left; }
      .tl-item:nth-child(even) .tl-left { order: unset; padding-left: 2.5rem; }
      .tl-item:nth-child(even) .tl-right { order: unset; padding-left: 2.5rem; padding-right: 0; text-align: left; }
    }

    /* ─── PROJECTS ──────────────────────────────────────────────── */
    #projects .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      margin-top: 4rem;
      border: 1px solid var(--border);
    }
    .proj-card {
      background: var(--bg-panel);
      padding: 2rem;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s;
      position: relative; overflow: hidden;
    }
    .proj-card::before {
      content: ""; position: absolute;
      top: 0; left: 0; width: 14px; height: 14px;
      border-top: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan);
      opacity: 0.3; transition: opacity 0.3s;
    }
    .proj-card:hover::before { opacity: 1; }
    .proj-card:hover { background: rgba(0,240,255,0.03); }
    .proj-type {
      font-family: var(--font-mono); font-size: 0.58rem;
      letter-spacing: 0.12em; color: var(--cyan);
      margin-bottom: 1rem;
    }
    .proj-name {
      font-family: var(--font-serif); font-size: 1.6rem;
      font-weight: 400; color: var(--white);
      line-height: 1.1; margin-bottom: 0.75rem;
    }
    .proj-desc { font-size: 0.85rem; color: var(--gray-2); line-height: 1.75; margin-bottom: 1.25rem; }
    .proj-stack {
      display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.25rem;
    }
    .tag {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.06em; padding: 0.2rem 0.55rem;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--gray-2);
    }
    .proj-links { display: flex; gap: 1rem; }
    .proj-link {
      font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.08em; color: var(--gray-3);
      border-bottom: 1px solid var(--gray-3);
      padding-bottom: 1px; transition: color 0.2s, border-color 0.2s;
    }
    .proj-link:hover { color: var(--cyan); border-color: var(--cyan); }

    @media (max-width: 640px) {
      #projects .grid { grid-template-columns: 1fr; }
    }

    /* ─── RESEARCH ──────────────────────────────────────────────── */
    #research { background: var(--bg-2); }
    #research .inner { max-width: 900px; margin: 0 auto; }
    .pub-list { margin-top: 3.5rem; display: flex; flex-direction: column; gap: 1px; }
    .pub-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 1.75rem 2rem;
      display: grid; grid-template-columns: auto 1fr;
      gap: 1.5rem; align-items: start;
      transition: border-color 0.3s, background 0.3s;
      position: relative;
    }
    .pub-card::before {
      content: ""; position: absolute;
      top: 0; left: 0; width: 14px; height: 14px;
      border-top: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan);
      opacity: 0.3; transition: opacity 0.3s;
    }
    .pub-card:hover::before { opacity: 1; }
    .pub-card:hover { border-color: var(--border-hi); background: rgba(0,240,255,0.02); }
    .pub-badge {
      font-family: var(--font-mono); font-size: 0.58rem;
      letter-spacing: 0.08em; padding: 0.3rem 0.6rem;
      white-space: nowrap; align-self: start;
    }
    .badge-q1 { background: var(--amber-dim); border: 1px solid rgba(245,200,66,0.3); color: var(--amber); }
    .badge-pr { background: var(--cyan-dim);  border: 1px solid var(--border-hi);       color: var(--cyan); }
    .pub-year {
      font-family: var(--font-mono); font-size: 0.6rem;
      color: var(--gray-3); letter-spacing: 0.08em; margin-bottom: 0.4rem;
    }
    .pub-title {
      font-family: var(--font-serif); font-size: 1.1rem;
      font-weight: 400; color: var(--white);
      line-height: 1.4; margin-bottom: 0.4rem;
    }
    .pub-venue { font-size: 0.8rem; color: var(--gray-2); margin-bottom: 0.6rem; }
    .pub-authors { font-size: 0.78rem; color: var(--gray-3); font-style: italic; margin-bottom: 0.75rem; }
    .pub-authors strong { color: var(--gray-2); font-style: normal; }
    .pub-link {
      font-family: var(--font-mono); font-size: 0.62rem;
      letter-spacing: 0.08em; color: var(--gray-3);
      border-bottom: 1px solid var(--gray-3);
      padding-bottom: 1px; transition: color 0.2s, border-color 0.2s;
      display: inline-block;
    }
    .pub-link:hover { color: var(--cyan); border-color: var(--cyan); }
    .research-footer {
      margin-top: 2rem; text-align: center;
      font-family: var(--font-mono); font-size: 0.7rem;
