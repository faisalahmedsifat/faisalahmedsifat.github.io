<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faisal Ahmed Sifat — Distributed Systems · ML Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ─── TOKENS ───────────────────────────────────────────────── */
    :root {
      --bg:        #0d1117;
      --bg-2:      #161b22;
      --bg-panel:  #1f242c;
      --cyan:      #00f0ff;
      --cyan-dim:  rgba(0, 240, 255, 0.12);
      --cyan-mid:  rgba(0, 240, 255, 0.35);
      --amber:     #f5c842;
      --amber-dim: rgba(245, 200, 66, 0.15);
      --white:     #ffffff;
      --gray-1:    #e2e8f0;
      --gray-2:    #94a3b8;
      --gray-3:    #475569;
      --border:    #30363d;
      --border-hi: #00f0ff;
      --font-mono: 'Space Mono', monospace;
      --font-serif:'Cormorant Garamond', serif;
      --font-body: 'DM Sans', sans-serif;
      
      /* Tactile Shadow Tokens */
      --shadow-sm: 2px 2px 0px var(--cyan);
      --shadow-md: 4px 4px 0px rgba(0, 240, 255, 0.4);
      --shadow-lg: 6px 6px 0px rgba(0, 240, 255, 0.2);
    }

    /* ─── RESET ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--gray-1);
      font-family: var(--font-body);
      font-weight: 300;
      overflow-x: hidden;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--cyan); color: var(--bg); }

    /* ─── SCROLLBAR ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); border-left: 1px solid var(--border); }
    ::-webkit-scrollbar-thumb { background: var(--gray-3); }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

    /* ─── GRID BACKGROUND ───────────────────────────────────────── */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.2;
      z-index: -20;
      pointer-events: none;
    }

    /* ─── UTILITY & TACTILE CLASSES ─────────────────────────────── */
    .mono    { font-family: var(--font-mono); }
    .serif   { font-family: var(--font-serif); }
    .label   { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.12em; color: var(--cyan); text-transform: uppercase; }
    .muted   { color: var(--gray-2); }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
    .section { padding: 8rem 0; }

    /* Tactile Cards */
    .tactile-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .tactile-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-md);
      border-color: var(--cyan);
    }
    .tactile-card:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px transparent;
    }

    /* Tactile Buttons */
    .tactile-btn {
      font-family: var(--font-mono); font-size: 0.72rem;
      letter-spacing: 0.1em; padding: 0.75rem 1.75rem;
      border: 1px solid var(--border-hi); 
      background: var(--cyan-dim);
      color: var(--cyan); 
      display: inline-block;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
      cursor: pointer;
    }
    .tactile-btn:hover { background: var(--cyan); color: var(--bg); }
    .tactile-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px transparent;
    }
    .tactile-btn.ghost { background: var(--bg); border-color: var(--gray-3); color: var(--gray-2); box-shadow: 2px 2px 0px var(--gray-3); }
    .tactile-btn.ghost:hover { border-color: var(--white); color: var(--bg); background: var(--white); box-shadow: 2px 2px 0px var(--white); }
    .tactile-btn.ghost:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px transparent; }

    /* section heading */
    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 300;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--white);
    }
    .section-title span { color: var(--gray-3); }
    .rule { width: 3rem; height: 1px; background: var(--cyan); opacity: 0.5; margin: 1.5rem 0; }

    /* ─── NAV ───────────────────────────────────────────────────── */
    #nav {
      position: sticky; top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.5rem; font-weight: 600;
      letter-spacing: -0.03em; color: var(--white);
      transition: transform 0.1s ease;
    }
    .nav-logo:active { transform: translateY(2px); }
    .nav-links {
      display: flex; align-items: center; gap: 0;
    }
    .nav-links .nav-group {
      display: flex; align-items: center;
      padding: 0.4rem 0.5rem;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
    }
    .nav-links a {
      font-family: var(--font-mono);
      font-size: 0.7rem; letter-spacing: 0.08em;
      padding: 0.4rem 1rem;
      color: var(--gray-2);
      transition: color 0.1s;
    }
    .nav-links a:hover { color: var(--cyan); }
    .nav-links a:active { transform: translateY(1px); }
    
    .nav-cv {
      font-family: var(--font-mono);
      font-size: 0.7rem; letter-spacing: 0.08em;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--gray-3);
      background: var(--bg);
      color: var(--gray-1);
      box-shadow: 2px 2px 0px var(--gray-3);
      transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
      margin-left: 1.5rem;
    }
    .nav-cv:hover { background: var(--gray-1); color: var(--bg); }
    .nav-cv:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px transparent; }

    /* mobile burger */
    #burger {
      display: none; flex-direction: column;
      gap: 5px; cursor: pointer; background: none; border: none; padding: 4px;
    }
    #burger span { width: 22px; height: 1.5px; background: var(--white); display: block; transition: all 0.3s; }
    #mobile-menu {
      display: none; position: fixed; inset: 0; top: 60px;
      background: var(--bg); z-index: 99;
      flex-direction: column; justify-content: center; align-items: center;
      gap: 2.5rem; border-top: 1px solid var(--border);
    }
    #mobile-menu.open { display: flex; }
    #mobile-menu a {
      font-family: var(--font-serif); font-size: 2.5rem;
      color: var(--gray-1); transition: color 0.2s;
    }
    #mobile-menu a:hover { color: var(--cyan); }

    @media (max-width: 768px) {
      .nav-links, .nav-cv { display: none; }
      #burger { display: flex; }
    }

    /* ─── HERO ──────────────────────────────────────────────────── */
    #hero {
      min-height: calc(100vh - 70px);
      display: flex; align-items: center;
      padding: 4rem 0;
      position: relative;
    }
    .hero-content { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem; letter-spacing: 0.15em;
      color: var(--cyan); margin-bottom: 2rem;
    }
    .hero-sub {
      font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.2em; color: var(--gray-3);
      text-transform: uppercase; margin-bottom: 1.5rem;
    }
    .hero-name {
      font-family: var(--font-serif);
      font-size: clamp(4rem, 12vw, 9.5rem);
      font-weight: 300; line-height: 0.88;
      letter-spacing: -0.03em;
      margin-bottom: 3rem;
    }
    .hero-name .line-1 { display: block; color: var(--white); }
    .hero-name .line-2 { display: block; color: var(--gray-3); }
    .hero-rule {
      width: 4rem; height: 1px; background: rgba(0,240,255,0.4);
      margin-bottom: 2.5rem;
    }
    .hero-card {
      display: inline-block;
      padding: 1.25rem 1.75rem;
    }
    .hero-card-tag {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.12em; color: var(--gray-3);
      text-transform: uppercase; margin-bottom: 0.6rem;
    }
    .hero-card-text {
      font-family: var(--font-serif);
      font-size: clamp(1.1rem, 2.5vw, 1.55rem);
      font-weight: 300; line-height: 1.4; color: var(--white);
      max-width: 560px;
    }
    .hero-card-text .accent { color: var(--cyan); border-bottom: 1.5px solid var(--cyan); padding-bottom: 1px; }
    .hero-ctas {
      display: flex; gap: 1.5rem; margin-top: 2.5rem; flex-wrap: wrap;
    }

    /* ─── ABOUT ─────────────────────────────────────────────────── */
    #about .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 5rem; align-items: start;
    }
    .about-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; margin-top: 2.5rem;
      border: 1px solid var(--border);
      background: var(--border);
      box-shadow: var(--shadow-sm);
    }
    .stat-card {
      background: var(--bg-panel); padding: 1.25rem 1rem;
      text-align: center;
    }
    .stat-num {
      font-family: var(--font-serif); font-size: 2.8rem;
      font-weight: 300; color: var(--cyan); line-height: 1;
      display: block; margin-bottom: 0.3rem;
    }
    .stat-label {
      font-family: var(--font-mono); font-size: 0.58rem;
      letter-spacing: 0.1em; color: var(--gray-3);
      text-transform: uppercase;
    }
    .about-text p { color: var(--gray-2); margin-bottom: 1.25rem; font-size: 0.95rem; line-height: 1.8; }
    .about-text p:first-child::first-letter {
      font-family: var(--font-serif); font-size: 3.5rem;
      font-weight: 300; float: left; line-height: 0.8;
      margin-right: 0.15em; color: var(--white);
    }
    @media (max-width: 768px) { #about .grid { grid-template-columns: 1fr; gap: 3rem; } }

    /* ─── EXPERIENCE ────────────────────────────────────────────── */
    #experience { background: var(--bg-2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    #experience .timeline {
      max-width: 900px; margin: 4rem auto 0; position: relative;
    }
    #experience .timeline::before {
      content: ""; position: absolute;
      left: 50%; top: 0; bottom: 0; width: 2px;
      background: var(--border); transform: translateX(-50%);
    }
    .tl-item {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0; margin-bottom: 4rem; position: relative;
    }
    .tl-dot {
      position: absolute; left: 50%; top: 0.5rem;
      width: 14px; height: 14px;
      background: var(--bg); border: 2px solid var(--cyan);
      transform: translateX(-50%);
      box-shadow: 2px 2px 0px rgba(0, 240, 255, 0.4);
    }
    .tl-left { padding-right: 3rem; text-align: right; }
    .tl-right { padding-left: 3rem; }
    .tl-role {
      font-family: var(--font-serif); font-size: 1.5rem;
      font-weight: 400; color: var(--white); line-height: 1.2;
      margin-bottom: 0.3rem;
    }
    .tl-org { font-size: 0.85rem; color: var(--gray-2); margin-bottom: 0.3rem; }
    .tl-date {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.12em; color: var(--cyan);
      text-transform: uppercase;
    }
    .tl-desc { font-size: 0.88rem; color: var(--gray-2); line-height: 1.7; background: var(--bg-panel); padding: 1.25rem; border: 1px solid var(--border); box-shadow: 2px 2px 0px var(--border); }
    
    .tl-item:nth-child(even) .tl-left { order: 2; text-align: left; padding-left: 3rem; padding-right: 0; }
    .tl-item:nth-child(even) .tl-right { order: 1; padding-right: 3rem; padding-left: 0; text-align: right; }

    @media (max-width: 768px) {
      #experience .timeline::before { left: 1rem; }
      .tl-item { grid-template-columns: 1fr; }
      .tl-dot { left: 1rem; }
      .tl-left, .tl-right { padding-left: 3rem; padding-right: 0; text-align: left; }
      .tl-item:nth-child(even) .tl-left, .tl-item:nth-child(even) .tl-right { order: unset; padding-left: 3rem; padding-right: 0; text-align: left; }
    }

    /* ─── PROJECTS ──────────────────────────────────────────────── */
    #projects .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-top: 4rem;
    }
    .proj-card {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
    }
    .proj-type {
      font-family: var(--font-mono); font-size: 0.58rem;
      letter-spacing: 0.12em; color: var(--cyan);
      margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;
    }
    .proj-name {
      font-family: var(--font-serif); font-size: 1.8rem;
      font-weight: 400; color: var(--white);
      line-height: 1.1; margin-bottom: 1rem;
    }
    .proj-desc { font-size: 0.85rem; color: var(--gray-2); line-height: 1.75; margin-bottom: 1.5rem; flex-grow: 1; }
    .proj-stack {
      display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem;
    }
    .tag {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.06em; padding: 0.2rem 0.55rem;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--gray-1);
    }
    .proj-links { display: flex; gap: 1rem; }
    .proj-link {
      font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.08em; color: var(--white);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem; 
      box-shadow: 2px 2px 0px var(--border);
      transition: all 0.1s;
    }
    .proj-link:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 2px 2px 0px var(--cyan); }
    .proj-link:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px transparent; }

    @media (max-width: 640px) { #projects .grid { grid-template-columns: 1fr; } }

    /* ─── RESEARCH ──────────────────────────────────────────────── */
    #research { background: var(--bg-2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    #research .inner { max-width: 900px; margin: 0 auto; }
    .pub-list { margin-top: 3.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .pub-card {
      padding: 1.75rem 2rem;
      display: grid; grid-template-columns: auto 1fr;
      gap: 1.5rem; align-items: start;
    }
    .pub-badge {
      font-family: var(--font-mono); font-size: 0.58rem;
      letter-spacing: 0.08em; padding: 0.3rem 0.6rem;
      white-space: nowrap; align-self: start;
      border-radius: 0; box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }
    .badge-q1 { background: var(--amber-dim); border: 1px solid rgba(245,200,66,0.5); color: var(--amber); box-shadow: 2px 2px 0px rgba(245,200,66,0.3); }
    .badge-pr { background: var(--cyan-dim);  border: 1px solid var(--border-hi);       color: var(--cyan); box-shadow: 2px 2px 0px rgba(0,240,255,0.3); }
    .pub-year {
      font-family: var(--font-mono); font-size: 0.6rem;
      color: var(--gray-3); letter-spacing: 0.08em; margin-bottom: 0.4rem;
    }
    .pub-title {
      font-family: var(--font-serif); font-size: 1.2rem;
      font-weight: 400; color: var(--white);
      line-height: 1.4; margin-bottom: 0.4rem;
    }
    .pub-venue { font-size: 0.8rem; color: var(--cyan); margin-bottom: 0.6rem; }
    .pub-authors { font-size: 0.78rem; color: var(--gray-3); font-style: italic; margin-bottom: 0.75rem; }
    .pub-authors strong { color: var(--gray-1); font-style: normal; font-weight: 500; }
    
    .pub-link {
      font-family: var(--font-mono); font-size: 0.62rem;
      letter-spacing: 0.08em; color: var(--white);
      border: 1px solid var(--border); background: var(--bg);
      padding: 0.3rem 0.8rem; box-shadow: 2px 2px 0px var(--border);
      transition: all 0.1s;
      display: inline-block;
    }
    .pub-link:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 2px 2px 0px var(--cyan); }
    .pub-link:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px transparent; }

    .research-footer {
      margin-top: 3rem; text-align: center;
      font-family: var(--font-mono); font-size: 0.75rem;
      color: var(--gray-3);
    }
    .research-footer a { color: var(--cyan); border-bottom: 1px solid var(--cyan); padding-bottom: 2px; }

    @media (max-width: 640px) { .pub-card { grid-template-columns: 1fr; gap: 1rem; } }

    /* ─── SKILLS ────────────────────────────────────────────────── */
    #skills { padding: 6rem 0; }
    .skills-band {
      border: 1px solid var(--border);
      background: var(--bg-panel);
      box-shadow: var(--shadow-sm);
    }
    .skill-row {
      display: grid; grid-template-columns: 9rem 1fr;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    .skill-row:last-child { border-bottom: none; }
    .skill-cat {
      font-family: var(--font-mono); font-size: 0.6rem;
      letter-spacing: 0.12em; color: var(--white);
      text-transform: uppercase; align-self: center;
      background: var(--bg); border: 1px solid var(--border);
      padding: 0.3rem 0.6rem; text-align: center;
      box-shadow: 1px 1px 0px var(--cyan);
    }
    .skill-items {
      font-family: var(--font-mono); font-size: 0.72rem;
      color: var(--gray-2); letter-spacing: 0.04em; align-self: center;
    }
    .skill-items span { color: var(--border); margin: 0 0.6rem; }

    @media (max-width: 640px) {
      .skill-row { grid-template-columns: 1fr; gap: 1rem; padding: 1.5rem; }
      .skill-cat { align-self: flex-start; }
    }

    /* ─── CONTACT ───────────────────────────────────────────────── */
    #contact { text-align: center; padding-bottom: 8rem; }
    .contact-card {
      max-width: 640px; margin: 3.5rem auto 0;
      padding: 4rem 2.5rem;
    }
    .contact-email {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 300; color: var(--cyan);
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.25rem; display: inline-block; margin-bottom: 3rem;
      transition: color 0.1s, border-color 0.1s;
    }
    .contact-email:hover { color: var(--white); border-color: var(--cyan); }
    .contact-links {
      display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;
    }
    .contact-link {
      font-family: var(--font-mono); font-size: 0.68rem;
      letter-spacing: 0.1em; color: var(--gray-1);
      text-transform: uppercase; 
      border: 1px solid var(--border); background: var(--bg);
      padding: 0.75rem 1.25rem;
      box-shadow: 2px 2px 0px var(--border);
      transition: all 0.1s;
    }
    .contact-link:hover { border-color: var(--cyan); box-shadow: 2px 2px 0px var(--cyan); color: var(--cyan); }
    .contact-link:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px transparent; }

    /* ─── FOOTER ────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
      background: var(--bg-2);
    }
    footer .mono { font
